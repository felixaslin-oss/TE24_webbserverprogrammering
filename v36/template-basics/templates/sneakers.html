<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Lärarlista</title>
</head>
<body>
    <h1>Lärarlista</h1>

    {% if subjects %}
        <table border="1">
            <tr>
                <th>Ämne</th>
                <th>Antal elever</th>
                <th>Lärare</th>
            </tr>
            {% for subject in subjects %}
                <tr>
                    <td>{{ subject.amne }}</td>
                    <td>{{ subject.elever }}</td>
                    <td>{{ subject.larare }}</td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Inga ämnen finns tillgängliga.</p>
    {% endif %}

    <p><a href="/">Tillbaka till startsidan</a></p>
</body>
</html>
